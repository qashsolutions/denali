name: Build & Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 236823123138.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: denali
  ECS_CLUSTER: denali
  ECS_SERVICE: denali-web
  TASK_DEFINITION_FAMILY: denali
  CONTAINER_NAME: denali

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for AWS auth
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npx vitest run

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1
        with:
          role-to-assume: arn:aws:iam::236823123138:role/denali-prod-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7  # v2

      - name: Build, tag, and push image to ECR
        id: build-image
        working-directory: app
        env:
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_DEFINITION_FAMILY \
            --query taskDefinition \
            > /tmp/task-definition.json

      - name: Remove task definition healthCheck (use Dockerfile HEALTHCHECK instead)
        run: |
          jq 'del(.containerDefinitions[0].healthCheck)' /tmp/task-definition.json \
            > /tmp/task-definition-clean.json
          mv /tmp/task-definition-clean.json /tmp/task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e  # v1
        with:
          task-definition: /tmp/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # Phase-2 prod-isolation gate (operator delta 4 — MANDATORY).
      #
      # The E2E test-OTP bypass is staging-only. If any task def env key
      # starts with `E2E_TEST_OTP`, FAIL the prod deploy here, BEFORE
      # ECS sees the revision. The runtime guards + module-load
      # assertion in `app/src/lib/e2e-test-otp.ts` are the in-process
      # backstop; this gate keeps the misconfiguration from ever
      # reaching the prod cluster.
      - name: Prod task-def gate — refuse any E2E_TEST_OTP env var
        run: |
          set -euo pipefail
          TD='${{ steps.task-def.outputs.task-definition }}'
          # The render-task-definition step writes the rendered task
          # def to a file path; jq reads it directly.
          LEAKS=$(jq -r '[.containerDefinitions[].environment[]?
                          | select(.name | startswith("E2E_TEST_OTP"))
                          | .name] | join(", ")' "$TD")
          if [ -n "$LEAKS" ]; then
            echo "::error::Refusing to deploy: prod task def contains E2E_TEST_OTP env vars: $LEAKS"
            echo "These env vars are staging-only. Remove them from the prod task def env block."
            exit 1
          fi
          echo "Prod task-def gate: clean (no E2E_TEST_OTP env keys)"

      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@fc8fc60f3a60ffd500fcb13b209c59d221ac8c8c  # v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Tag successful deploy as prod-stable
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --query 'images[0].imageManifest' \
            --output text)
          aws ecr put-image \
            --repository-name $ECR_REPOSITORY \
            --image-tag prod-stable \
            --image-manifest "$MANIFEST"
          echo "Tagged $IMAGE_TAG as prod-stable"
